name: check
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: No sorry in the proofs
        run: "! grep -rn -E 'sorry|native_decide|^axiom ' AlmostInvariant AlmostInvariant.lean KPFull KPFull.lean"
      - name: Axioms
        run: |
          set -o pipefail
          lake env lean Check/Axioms.lean | tee axioms.txt
          if grep -q -E 'sorryAx|ofReduceBool|trustCompiler' axioms.txt; then exit 1; fi
          test "$(grep -c 'depends on axioms' axioms.txt)" -eq 11
      - name: Axioms, full statement
        run: |
          set -o pipefail
          lake env lean Check/AxiomsFull.lean | tee axioms-full.txt
          if grep -q -E 'sorryAx|ofReduceBool|trustCompiler' axioms-full.txt; then exit 1; fi
          test "$(grep -c 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' axioms-full.txt)" -eq 9
      - name: Same statements
        run: |
          lake build Challenge
          lake env lean Check/SameStatement.lean
          lake env lean Check/SameStatementFull.lean
      - name: The new statements contain the old one-sided statement
        run: |
          set -o pipefail
          lake env lean Check/Contains.lean | tee contains.txt
          if grep -q -E 'sorryAx|ofReduceBool|trustCompiler' contains.txt; then exit 1; fi
          test "$(grep -c 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' contains.txt)" -eq 2
