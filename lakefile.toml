name = "almost_invariant"
defaultTargets = ["AlmostInvariant", "KPFull", "KPLower", "KPLattice"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# The proofs for one orbit.
[[lean_lib]]
name = "AlmostInvariant"

# The proofs of the full original statement (families). The root file KPFull.lean imports every proof file.
[[lean_lib]]
name = "KPFull"

# The Lean proof of remark B1 (the one-sided bound needs order r^2). The root file KPLower.lean imports every proof file.
[[lean_lib]]
name = "KPLower"

# The same theorems for an abstract lattice with a rank function (modular lattices of finite rank).
# The root file KPLattice.lean imports both proof files.
[[lean_lib]]
name = "KPLattice"

# The statements alone, with `sorry` in place of the proofs. Not a default target.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge.Statement", "Challenge.StatementFull", "Challenge.StatementB1"]
